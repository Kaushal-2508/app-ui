<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{--teal:#1f9499;--teal-deep:#14696d;--orange:#fa920e;--violet:#6f56a8;--ink-900:#16202b;--ink-500:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#f3f6f7;padding:28px;color:#2f3e4d;}
  .wrap{max-width:1180px;margin:0 auto;}
  .subtle-head{font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:14px;}
  .card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(20,60,70,.45);border:1px solid #eef2f4;}

  .hero{position:relative;overflow:hidden;color:#fff;padding:34px 44px;
    background:radial-gradient(460px 260px at 22% -10%, rgba(255,255,255,.16), transparent 62%),
      radial-gradient(420px 240px at 78% 120%, rgba(250,146,14,.16), transparent 60%),
      linear-gradient(120deg,#1f9499 0%,#15828a 52%,#0e5a61 100%);}
  .heroin{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:40px;}
  /* horizontal identity: medal beside the result text */
  .hero-left{display:flex;align-items:center;gap:22px;}
  .medal{display:block;flex-shrink:0;filter:drop-shadow(0 10px 16px rgba(0,0,0,.30));}
  .idtext{}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.82);}
  .tier{margin-top:6px;font-size:14px;font-weight:800;letter-spacing:.24em;background:linear-gradient(180deg,#ffe9a8,#f1c052);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-flex;align-items:center;gap:9px;}
  .tier .st{width:11px;height:11px;}
  .score{margin-top:10px;font-size:50px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#fff;}
  .score small{font-size:28px;font-weight:700;color:rgba(255,255,255,.52);}
  .pct{margin-top:6px;font-size:18px;font-weight:700;color:rgba(255,255,255,.9);}
  .celebrate{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,226,156,.55);color:#ffe7bd;font-size:12px;font-weight:700;}
  .celebrate svg{width:14px;height:14px;}

  .panel{width:360px;flex-shrink:0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:20px 22px 18px;}
  .panel .ph{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.72);margin-bottom:14px;text-align:center;}
  .ringrow{display:flex;align-items:center;gap:20px;}
  .ring{position:relative;width:116px;height:116px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .ctr b{font-size:25px;font-weight:800;color:#fff;line-height:1;}
  .ring .ctr span{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:2px;}
  .legend{flex:1;}
  .legrow{display:flex;align-items:center;gap:9px;padding:6px 0;}
  .legrow .d{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legrow .lt{flex:1;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.86);}
  .legrow .lv{font-size:14px;font-weight:800;color:#fff;}

  .body{padding:20px 24px 6px;}
  .ranks{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .rk{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:16px;border:1px solid;}
  .rk.teal{background:rgba(31,148,153,.09);border-color:rgba(31,148,153,.22);}
  .rk.violet{background:rgba(111,86,168,.09);border-color:rgba(111,86,168,.22);}
  .disc{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rk.teal .disc{background:rgba(31,148,153,.15);color:#14696d;}.rk.violet .disc{background:rgba(111,86,168,.15);color:#5a4790;}
  .disc svg{width:22px;height:22px;}
  .rk .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;}
  .rk.teal .lab{color:#14696d;}.rk.violet .lab{color:#5a4790;}
  .rk .v{font-size:22px;font-weight:800;color:var(--ink-900);margin-top:1px;line-height:1.05;}
  .rk .v small{font-size:12.5px;font-weight:500;color:var(--ink-500);}
</style></head>
<body><div class="wrap">
  <div class="subtle-head">New Flow Demo · Roll SO26-NEW00A-09-0001</div>
  <div class="card">
    <div class="hero">
      <div class="heroin">
        <div class="hero-left">
          <svg class="medal" width="92" height="104" viewBox="0 0 92 104">
            <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f3c357"/><stop offset="1" stop-color="#d99a2b"/></linearGradient></defs>
            <path d="M34 56 L26 100 L40 90 L46 99 L52 90 L66 100 L58 56 Z" fill="#0f6066"/><path d="M37 58 L31 92 L40 86 L46 94 L52 86 L61 92 L55 58 Z" fill="#0c4d52"/>
            <circle cx="46" cy="40" r="35" fill="url(#gold)"/><circle cx="46" cy="40" r="35" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><circle cx="46" cy="40" r="27" fill="#0e5a61"/>
            <g transform="translate(46,40)" fill="none" stroke="#f5cd63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-7 -10 h14 v4 a7 7 0 0 1 -14 0 z"/><path d="M-7 -8 h-3 a3 3 0 0 0 3 5"/><path d="M7 -8 h3 a3 3 0 0 1 -3 5"/><path d="M-3 1 v4 h6 v-4"/><path d="M-5 9 h10"/></g>
          </svg>
          <div class="idtext">
            <div class="eyebrow">Your result</div>
            <div class="tier"><svg class="st" viewBox="0 0 24 24" fill="#f3c357"><path d="M12 2l2.9 6.3L22 9.3l-5 4.6 1.3 6.9L12 17.8 5.7 20.8 7 13.9 2 9.3l7.1-1z"/></svg>GOLD<svg class="st" viewBox="0 0 24 24" fill="#f3c357"><path d="M12 2l2.9 6.3L22 9.3l-5 4.6 1.3 6.9L12 17.8 5.7 20.8 7 13.9 2 9.3l7.1-1z"/></svg></div>
            <div class="score">28 <small>/ 30</small></div>
            <div class="pct">93.33%</div>
            <div class="celebrate"><svg viewBox="0 0 24 24" fill="none" stroke="#ffe7bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/></svg>1st in your class &amp; school</div>
          </div>
        </div>
        <div class="panel">
          <div class="ph">How you answered</div>
          <div class="ringrow">
            <div class="ring">
              <svg width="116" height="116" viewBox="0 0 116 116">
                <circle cx="58" cy="58" r="47" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"/>
                <circle cx="58" cy="58" r="47" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="19.7"/>
              </svg>
              <div class="ctr"><b>93%</b><span>Accuracy</span></div>
            </div>
            <div class="legend">
              <div class="legrow"><span class="d" style="background:#34d399"></span><span class="lt">Correct</span><span class="lv">28</span></div>
              <div class="legrow"><span class="d" style="background:#fb7185"></span><span class="lt">Incorrect</span><span class="lv">2</span></div>
              <div class="legrow"><span class="d" style="background:rgba(255,255,255,.5)"></span><span class="lt">Total</span><span class="lv">30</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="body">
      <div class="ranks">
        <div class="rk teal"><div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 21.4l-3.6-2.7a1 1 0 0 0-1.2 0L8.6 21.4l1.5-8.5"/></svg></div><div><div class="lab">Class rank</div><div class="v">1 <small>of 39</small></div></div></div>
        <div class="rk violet"><div class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div><div><div class="lab">Percentile</div><div class="v">Top 1<small>%</small></div></div></div>
      </div>
    </div>
  </div>
</div></body></html>
