<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SALCI - Empowering Learning Beyond Marks</title>
    <meta name="description" content="SALCI is a complete academic intelligence ecosystem for schools — combining fair AI-assisted evaluation, teacher control, and actionable insights." />
    <meta name="author" content="SALCI" />
    <!-- App portal must stay out of search engines; the public marketing site is salci.ai -->
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:title" content="SALCI - Empowering Learning Beyond Marks" />
    <meta property="og:description" content="Redefining Assessments. Restoring Trust in Learning. Fair AI-assisted evaluation for schools." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.salci.ai/Logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://app.salci.ai/Logo.png" />

    <!-- Declared explicitly. With no icon link at all a browser silently requests
         /favicon.ico on every document load, and that file is 179 KB served with
         max-age=0, so it was revalidated on every load by every user. Naming it
         here lets vercel.json give it a real cache lifetime (it is unversioned,
         so a day, never immutable). Replacing the 179 KB .ico with a small PNG or
         SVG is still worth doing separately. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
