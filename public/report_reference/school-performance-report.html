<!--
  ============================================================
  STANDARD SCHOOL PERFORMANCE REPORT — single file
  4 pages, A4 portrait. Open in a browser, then Print → Save as PDF.

  This report STATES WHAT THE DATA SAYS. No recommendations, no
  suggested actions, no priorities. Every sentence is a fact, a
  count, or a comparison against a threshold the school set itself.

  THIS FILE CONTAINS, IN ORDER
    1. Print stylesheet        — page geometry and table styling
    2. CONFIG                  — thresholds, vocabulary, roles  ← EDIT THIS
    3. DATA                    — this school's figures           ← REPLACE THIS
    4. Renderer                — builds the four pages from 2 and 3

  TO USE IT FOR ANOTHER SCHOOL
    - Replace the DATA object with that school's export.
    - Set CONFIG.labels to its own vocabulary (Section / Stream / House).
    - Nothing in the renderer or stylesheet needs to change.

  THE REPORT SETS NO TARGETS
    There is no "good", "healthy" or "pace" line to configure. Only two
    reference points are used, and both come from outside the report:
      - share of the academic session elapsed, taken from the calendar
      - the CBSE 75% attendance requirement for board eligibility
    Everything else is a value, a count, or a rank.

  THE DATA MUST SATISFY THESE, OR THE REPORT WILL MISSTATE THEM
    1. Every countable field on a parent equals the sum of its children:
       subject → class → wing → school.
    2. Attendance is the exception: logged per class per day, rolled up
       WEIGHTED BY ROSTER SIZE, never a plain mean of percentages.
    3. Averages are weighted — score by exam attempts, coverage by chapter
       count, homework by assignment × student slots.
    4. papersPublished + pendingGrading = papers, and
       papers + papersScheduled + papersDraft = papersPlanned, on every row.
    5. pendingGrading <= papers, papersPlanned >= papers, wkDone <= wkPlanned.
    6. A subject with no paper sets accRaw: null — never 0. The report
       excludes it from averages and names it as a gap.
    7. Every student listed in absentees has attendance < CONFIG.attendanceFloor.
    8. meta.yearGone is the share of the session elapsed, from the calendar —
       every "behind / level" reading in the report is measured against it.

  PAGE BUDGET
    Each page is capped so it cannot overflow; long lists truncate and say
    how many rows they withheld. If a build produces more than 4 pages,
    lower a cap — do not loosen the stylesheet.
  ============================================================
-->
<title>School Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STANDARD SCHOOL PERFORMANCE REPORT — 4 pages, A4 portrait.
   A reporting format, not a data dump: the verdict first, the
   exceptions second, and only the evidence a reader needs to
   challenge either. Every threshold, label and list length comes
   from CONFIG, so the same four pages fit a 3-wing primary or a
   12-stream senior school without editing this file.
   Page 1  Summary and the week's actions
   Page 2  Teaching and curriculum
   Page 3  Assessment and staff
   Page 4  Students, attendance and sign-off
   ============================================================ */
:root {
  --ink:    #16211F;
  --ink-2:  #46534F;
  --ink-3:  #7A857F;
  --rule:   #C6C1B4;
  --rule-2: #E6E2D8;
  --band:   #F1EEE6;
  --band-2: #FAF8F3;
  --brand:  #176F74;
  --exc:    #0A6B2D;
  --watch:  #8E5E00;
  --att:    #A82727;
}
@page { size: A4 portrait; margin: 13mm 13mm 16mm; }

* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #fff; color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 9pt; line-height: 1.36; }

@media screen {
  body { background: #E6E2DA; padding: 16px 0 40px; }
  .pg { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto 16px;
    padding: 13mm 13mm 16mm; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
}
@media print { .pg { break-after: page; } .pg:last-child { break-after: auto; } }

/* ---------- type ---------- */
h1 { font-size: 19pt; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin: 0; }
h2 { font-size: 10.6pt; font-weight: 800; letter-spacing: -.02em; margin: 4mm 0 1.6mm;
     padding-bottom: 1.1mm; border-bottom: 1.3pt solid var(--ink); }
h2:first-of-type { margin-top: 0; }
h3 { font-size: 9pt; font-weight: 750; margin: 2.6mm 0 1.2mm; }
p { margin: 0 0 1.6mm; }
.kick { font-size: 7.4pt; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); }
.muted { color: var(--ink-3); }
.sm { font-size: 8.2pt; }
.xs { font-size: 7.6pt; color: var(--ink-3); }

/* ---------- masthead ---------- */
.mast { display: flex; align-items: flex-end; gap: 6mm; border-bottom: 2.4pt solid var(--ink);
  padding-bottom: 2.4mm; margin-bottom: 3mm; }
.mast .id { flex: 1; }
.mast .id .school { font-size: 10.5pt; font-weight: 750; color: var(--brand); margin-bottom: .8mm; }
.mast .when { text-align: right; font-size: 8.2pt; color: var(--ink-2); line-height: 1.5; }
.mast .when b { color: var(--ink); }

/* running page head on pages 2–4 */
.phead { display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: .8pt solid var(--rule); padding-bottom: 1.2mm; margin-bottom: 3mm;
  font-size: 7.8pt; color: var(--ink-3); }
.phead b { color: var(--ink); font-size: 8.6pt; }

/* ---------- the summary, as pointers ----------
   Prose made the reader hunt for the number inside a sentence. One fact per
   line, number first, two columns so the whole picture is one glance. */
.verdict { border-left: 3pt solid var(--brand); background: var(--band-2);
  padding: 2.6mm 3.4mm; margin-bottom: 3mm; }
.pts { column-count: 2; column-gap: 7mm; list-style: none; margin: 0; padding: 0; }
.pts li { break-inside: avoid; position: relative; padding: .85mm 0 .85mm 4mm;
  font-size: 8.9pt; line-height: 1.3; color: var(--ink-2); }
.pts li::before { content: ''; position: absolute; left: 0; top: 2.4mm;
  width: 1.7mm; height: 1.7mm; border-radius: .4mm; background: var(--brand); }
.pts li b { color: var(--ink); font-weight: 750; }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2mm; margin-bottom: 2.6mm; }
.kpi { border: .8pt solid var(--rule); border-left: 2.6pt solid var(--ink); padding: 1.8mm 2.4mm; }
.kpi.ok  { border-left-color: var(--exc); }
.kpi.mid { border-left-color: var(--watch); }
.kpi.bad { border-left-color: var(--att); }
.kpi .k { font-size: 7pt; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); }
.kpi .v { font-size: 15pt; font-weight: 800; letter-spacing: -.035em; margin: .6mm 0 0; }
.kpi .v small { font-size: 9pt; font-weight: 700; color: var(--ink-3); }
.kpi .s { font-size: 7.4pt; color: var(--ink-2); margin-top: .4mm; line-height: 1.3; }

/* ---------- actions ---------- */
.acts { border: .8pt solid var(--rule); }
.act { display: flex; gap: 2.6mm; padding: 1.6mm 2.6mm; border-bottom: .5pt solid var(--rule-2);
  align-items: baseline; }
.act:last-child { border-bottom: 0; }
.act .no { font-size: 11pt; font-weight: 800; color: var(--brand); width: 5mm; flex: none;
  letter-spacing: -.03em; }
.act .body { flex: 1; }
.act .t { font-weight: 700; font-size: 8.8pt; }
.act .s { font-size: 7.8pt; color: var(--ink-2); margin-top: .3mm; }
.act .owner { flex: none; text-align: right; font-size: 7.8pt; color: var(--ink-2); max-width: 42mm; }
.act .owner b { display: block; color: var(--ink); font-size: 8.2pt; }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; margin: 0 0 2.4mm;
  font-variant-numeric: tabular-nums; font-size: 8.1pt; }
th, td { padding: 1.05mm 1.8mm; text-align: left; border-bottom: .5pt solid var(--rule-2); }
thead th { background: var(--band); border-bottom: 1pt solid var(--ink); border-top: .5pt solid var(--rule);
  font-size: 7.2pt; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
tfoot td { background: var(--band-2); border-top: 1pt solid var(--ink); border-bottom: 1pt solid var(--ink);
  font-weight: 750; }
td.n, th.n { text-align: right; }
tbody tr:nth-child(even) td { background: #FCFBF8; }
.nm { font-weight: 700; }
td { white-space: nowrap; }
td:first-child, td:last-child, td.w { white-space: normal; }
.sub { font-size: 7.2pt; color: var(--ink-3); font-weight: 500; }
.more td { background: #fff !important; font-size: 7.6pt; color: var(--ink-3); font-style: italic; }

/* ---------- status: word + colour, never colour alone ---------- */
.st { font-weight: 750; white-space: nowrap; }
.st-exc { color: var(--exc); } .st-watch { color: var(--watch); } .st-att { color: var(--att); }

/* ---------- read-this line under a table ---------- */
.read { font-size: 8pt; color: var(--ink-2); margin: 0 0 2mm; line-height: 1.38; }
.read b { color: var(--ink); }

/* ---------- two-column band ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }

/* ---------- sign-off ---------- */
.sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; margin-top: 4mm;
  padding-top: 3mm; border-top: .8pt solid var(--rule); }
.sign div { font-size: 8pt; color: var(--ink-3); }
.sign div .line { border-bottom: .8pt solid var(--ink); height: 8mm; margin-bottom: 1.2mm; }
.method { border: .5pt dashed var(--rule); padding: 2mm 2.6mm; font-size: 7.2pt;
  color: var(--ink-2); line-height: 1.38; margin-top: 3mm; }
.method b { color: var(--ink); }
</style>

<script>
/* ============================================================
   4. RENDERER
   ============================================================ */
/* ============================================================
   STANDARD SCHOOL PERFORMANCE REPORT — renderer
   Input: D (the school's data) and CFG (thresholds and labels).

   THIS REPORT STATES WHAT THE DATA SAYS. No advice, no
   recommendations, no suggested actions, no priorities.

   IT SETS NO TARGETS OF ITS OWN. There is no configurable
   "good" or "healthy" line anywhere in here. The only two
   reference points used are ones the data already contains:
     · share of the academic session elapsed, from the calendar
     · the CBSE 75% attendance requirement for board eligibility
   Everything else is reported as a value, a count or a rank.

   Nothing below hardcodes a wing name, a class count or a
   subject list.
   ============================================================ */
const r0 = v => v == null ? '—' : Math.round(v).toLocaleString('en-IN');
const r1 = v => v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1);
const pc0 = v => v == null ? '—' : Math.round(v) + '%';
const pc1 = v => v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const plural = (n, s, p) => n === 1 ? s : (p || s + 's');

/* vocabulary from config: Wing / Section / Stream / House */
const T1 = CFG.labels.tier1, T2 = CFG.labels.tier2, T3 = CFG.labels.tier3;
const T1p = CFG.labels.tier1Plural, T2p = CFG.labels.tier2Plural;
const shortName = s => String(s).replace(new RegExp('\\s*' + T1 + '$', 'i'), '');
const shortCls = s => String(s).replace(/^Grade\s+/i, '');
/* irregular plurals come from config, not an s-suffix */
const pl2 = n => (n === 1 ? T2 : T2p).toLowerCase();
/* truncate on a comma boundary so a subject list never breaks mid-word */
const clip = (str, max) => {
  const t = String(str);
  if (t.length <= max) return t;
  const cut = t.lastIndexOf(',', max);
  return (cut > max * 0.4 ? t.slice(0, cut) : t.slice(0, max)) + '…';
};

const TIER1 = D.wings, SCH = D.school;
const CLASSES = TIER1.flatMap(w => w.classes.map(c => ({ ...c, t1: w })));
const SUBJECTS = CLASSES.flatMap(c => c.subjects.map(s => ({ ...s, cls: c })));

/* one grading rule, thresholds from config */
function tone(v, good, ok) { return v == null ? '' : v >= good ? 'st-exc' : v >= ok ? 'st-watch' : 'st-att'; }
function gv(v, good, ok, f) { return `<span class="st ${tone(v, good, ok)}">${(f || pc1)(v)}</span>`; }
const bandTone = { exc: 'st-exc', good: 'st-exc', watch: 'st-watch', att: 'st-att' };
const bandTxt = b => b ? `<span class="st ${bandTone[b]}">${CFG.bandLabels[b]}</span>` : '—';
const notStarted = o => o.chapters - o.chaptersDone - o.chaptersPartial;

/* THE ONLY TWO REFERENCE POINTS IN THE REPORT.
   ELAPSED comes from the academic calendar, not from a setting: at 77% of the
   way through the session, 77% coverage is level. The attendance floor is the
   board's requirement, not the school's opinion. An earlier draft invented a
   "pace line" and "healthy"/"good" thresholds and attributed them to the
   school; nothing of the sort exists, so they are gone. */
const ELAPSED = D.meta.yearGone;
const FLOOR = CFG.attendanceFloor;
/* level or ahead of the calendar, or behind it — two states, no middle band */
const covTone = v => v == null ? '' : v >= ELAPSED ? 'st-exc' : 'st-att';
const covV = v => `<span class="st ${covTone(v)}">${pc1(v)}</span>`;
/* attendance is marked only against the board floor */
const attV = v => v == null ? '—' : v < FLOOR ? `<span class="st st-att">${pc1(v)}</span>` : pc1(v);
/* scores carry no colour: there is no score target to be measured against */
const scoreV = v => v == null ? '—' : pc1(v);

/* every list is capped and says what it truncated */
function table(head, rows, opts) {
  opts = opts || {};
  const cap = opts.cap || CFG.listCap;
  const shown = rows.slice(0, cap);
  const cell = (c, i) => `<td class="${head[i] && head[i].n ? 'n' : ''}">${c}</td>`;
  const hid = rows.length - shown.length;
  return `<table>
    <thead><tr>${head.map(h => `<th class="${h.n ? 'n' : ''}">${h.t != null ? h.t : h}</th>`).join('')}</tr></thead>
    <tbody>${shown.map(r => `<tr>${r.map(cell).join('')}</tr>`).join('')}
      ${hid > 0 ? `<tr class="more"><td colspan="${head.length}">${hid} further ${plural(hid, 'row')} not shown — ${esc(opts.moreNote || 'full list in the console')}</td></tr>` : ''}</tbody>
    ${opts.foot ? `<tfoot><tr>${opts.foot.map(cell).join('')}</tr></tfoot>` : ''}</table>`;
}
const N = t => ({ t, n: true });

/* ============================================================
   COUNTS — computed once, quoted by both prose and tables so a
   sentence can never contradict the table beside it.
   ============================================================ */
const F = (function () {
  const behind = CLASSES.filter(c => c.syllabus < ELAPSED).sort((a, b) => a.syllabus - b.syllabus);
  const noPaper = SUBJECTS.filter(s => !s.papers);
  const assessed = D.subjRollup.filter(s => s.acc != null).sort((a, b) => a.acc - b.acc);
  const unassessed = D.subjRollup.filter(s => s.acc == null);
  const quiet = D.teachers.filter(t => t.level === CFG.minimalLevel);
  const pipePct = SCH.papersPlanned ? SCH.papers / SCH.papersPlanned * 100 : null;
  /* one definition, used by the pointers and by every table cell */
  const onPace = pct => pct != null && pct >= ELAPSED;
  return {
    behind, noPaper, assessed, unassessed, quiet, pipePct, onPace,
    lowCls: CLASSES.slice().sort((a, b) => a.syllabus - b.syllabus)[0],
    notStarted: notStarted(SCH),
    absent: D.absentees.length,
    atRisk: D.atRisk.length,
    never: D.meta.neverTotal,
    adoptPct: D.schoolStu.adoptPct,
    streak: D.absentees.filter(s => s.absentStreak >= CFG.streakAlert).length
  };
})();

/* ============================================================
   SUMMARY IN WORDS — statements of fact only.
   No judgement about whether a figure is acceptable, no cause,
   no consequence, no instruction. Clauses whose count is zero
   are dropped rather than printed as "0".
   ============================================================ */
function summary() {
  /* One fact per line, shortest form that stays unambiguous. Paragraphs made
     the reader parse a sentence to find a number; a pointer puts the number
     first. Lines whose count is zero are dropped, not printed as "0". */
  const B = v => `<b>${v}</b>`;
  const pts = [
    `${B(pc1(SCH.attendance))} attendance`,
    `${B(pc1(SCH.accuracy))} average score across ${r0(SCH.papers)} papers`,
    `${B(pc1(SCH.syllabus))} syllabus coverage, at ${B(pc0(ELAPSED))} of the session`,
    `${B(r0(F.notStarted))} of ${r0(SCH.chapters)} chapters not started`,
    F.behind.length
      ? `${B(F.behind.length + ' of ' + CLASSES.length)} ${pl2(CLASSES.length)} behind the calendar — lowest ${esc(shortCls(F.lowCls.code))} at ${pc0(F.lowCls.syllabus)}`
      : `${B('No ' + T2.toLowerCase())} is behind the calendar`,
    `${B(r0(SCH.papers) + ' of ' + r0(SCH.papersPlanned))} planned papers held (${pc0(F.pipePct)})`,
    `${B(SCH.wkDone + ' of ' + SCH.wkPlanned)} papers held this week`,
    F.noPaper.length
      ? `${B(r0(F.noPaper.length))} ${T3.toLowerCase()}–${T2.toLowerCase()} ${plural(F.noPaper.length, 'pair')} with no paper, excluded from averages`
      : '',
    SCH.pendingGrading
      ? `${B(r0(SCH.pendingGrading))} ${plural(SCH.pendingGrading, 'paper')} written, results not published` : '',
    `${B(F.quiet.length + ' of ' + D.teachers.length)} teachers at ${CFG.engagementLevels[CFG.minimalLevel].toLowerCase()} engagement`,
    `${B(r0(F.atRisk))} students flagged at risk (${pc0(F.atRisk / SCH.students * 100)} of roster)`,
    F.absent
      ? `${B(r0(F.absent))} below the ${FLOOR}% CBSE attendance floor${F.streak ? `, ${F.streak} absent ${CFG.streakAlert}+ days` : ''}`
      : '',
    F.never ? `${B(r0(F.never))} students never signed in` : '',
    `${B(pc0(F.adoptPct))} of the roster active this week`
  ].filter(Boolean);
  return `<ul class="pts">${pts.map(x => `<li>${x}</li>`).join('')}</ul>`;
}

/* ============================================================
   PAGE 1 — THE SCHOOL
   ============================================================ */
function page1() {
  const subjRows = F.assessed.map(s => [
    `<div class="nm">${esc(s.name)}</div>`, r0(s.papers),
    scoreV(s.acc), covV(s.cov)
  ]);

  const t1rows = TIER1.map(w => [
    `<div class="nm">${esc(shortName(w.name))}</div><div class="sub">${esc(w.span)} · ${esc(w.head)}</div>`,
    r0(w.classCount), r0(w.students),
    attV(w.attendance),
    covV(w.syllabus),
    pc0(w.lessonPct), scoreV(w.accuracy), bandTxt(w.band)
  ]);

  return `<div class="pg">
    <div class="mast">
      <div class="id">
        <div class="school">${esc(D.meta.school)}</div>
        <h1>School Performance Report</h1>
      </div>
      <div class="when"><b>${esc(D.meta.asOf)}</b><br>${esc(D.meta.year)} · ${pc0(D.meta.yearGone)} elapsed</div>
    </div>

    <h2>What the data says</h2>
    <div class="verdict">${summary()}</div>

    <p class="xs" style="margin:0 0 3mm">${r0(SCH.students)} students · ${r0(SCH.classCount)}
      ${pl2(SCH.classCount)} · ${TIER1.length} ${(TIER1.length === 1 ? T1 : T1p).toLowerCase()} ·
      ${r0(D.teachers.length)} teachers · ${r0(SCH.subjectPairs)} ${T3.toLowerCase()}–${T2.toLowerCase()} rows ·
      ${r0(SCH.chapters)} chapters in scope</p>

    <div class="two">
      <div>
        <h2>Chapter state</h2>
        ${table(['State', N('Chapters'), N('Share')], [
          ['<span class="st st-exc">Done</span>', r0(SCH.chaptersDone), pc1(SCH.chaptersDone / SCH.chapters * 100)],
          ['<span class="st st-watch">Partly done</span>', r0(SCH.chaptersPartial), pc1(SCH.chaptersPartial / SCH.chapters * 100)],
          ['<span class="st st-att">Not started</span>', r0(F.notStarted), pc1(F.notStarted / SCH.chapters * 100)]
        ], { cap: 99, foot: ['In scope', r0(SCH.chapters), '100%'] })}
        <p class="xs">A partly-done chapter counts as half a finished one: ${r0(SCH.chaptersDone)} done of
          ${r0(SCH.chapters)} reports as ${pc1(SCH.syllabus)} coverage.</p>
      </div>
      <div>
        <h2>${T3}s, lowest average score first</h2>
        ${table([T3, N('Papers'), N('Avg score'), N('Coverage')], subjRows,
          { cap: 4, moreNote: `${F.assessed.length} assessed ${T3.toLowerCase()}s in total` })}
        ${F.unassessed.length ? `<p class="xs"><b>${F.unassessed.length} not listed</b> —
          ${F.unassessed.map(s => esc(s.name)).join(', ')}: no paper recorded anywhere this year,
          excluded from averages rather than scored zero.</p>` : ''}
      </div>
    </div>

    <h2>Each ${T1.toLowerCase()}</h2>
    ${table([T1, N(T2p), N('Students'), N('Attendance'), N('Coverage'), N('Lessons'), N('Avg score'), 'Band'],
      t1rows, { cap: 99, foot: ['School', r0(SCH.classCount), r0(SCH.students), pc1(SCH.attendance),
        pc1(SCH.syllabus), pc0(SCH.lessonPct), pc1(SCH.accuracy), bandTxt(SCH.band)] })}


  </div>`;
}

/* ============================================================
   PAGE 2 — TEACHING AND CURRICULUM
   ============================================================ */
function page2() {

  const covSpread = Math.max(...TIER1.map(w => w.syllabus)) - Math.min(...TIER1.map(w => w.syllabus));
  const accSpread = Math.max(...TIER1.map(w => w.accuracy)) - Math.min(...TIER1.map(w => w.accuracy));

  return `<div class="pg">
    <div class="phead"><b>Teaching and curriculum</b><span>${esc(D.meta.school)} · ${esc(D.meta.asOf)} · page 2 of 4</span></div>

    <h2>Each ${T2.toLowerCase()}, lowest coverage first</h2>
    ${table([T2, T1, N('Students'), N('Coverage'), N('vs calendar'), N('Not started'), N('Attendance'),
             N('Avg score'), 'Band'],
      CLASSES.slice().sort((a, b) => a.syllabus - b.syllabus).map(c => [
        `<div class="nm">${esc(shortCls(c.code))}</div><div class="sub">${esc(c.teacherName)}</div>`,
        esc(shortName(c.t1.name)), r0(c.students),
        covV(c.syllabus),
        `<span class="st ${c.syllabus >= ELAPSED ? 'st-exc' : 'st-att'}">${c.syllabus >= ELAPSED ? '+' : '−'}${r1(Math.abs(c.syllabus - ELAPSED))}</span>`,
        `${r0(notStarted(c))} <span class="muted">of ${r0(c.chapters)}</span>`,
        attV(c.attendance),
        scoreV(c.accuracy), bandTxt(c.band)]),
      { cap: 12, moreNote: `${CLASSES.length} ${pl2(CLASSES.length)} in total, the rest level with the calendar or ahead` })}
    <p class="read">The <b>vs calendar</b> column is coverage minus ${pc0(ELAPSED)}, the share of the
      session elapsed — level means the ${T2.toLowerCase()} has taught as much of the book as the year
      has spent. ${F.behind.length ? `<b>${F.behind.length} of ${CLASSES.length} ${pl2(CLASSES.length)}</b>
      are behind it, by <b>${r0(F.behind.reduce((n, c) => n + Math.ceil((ELAPSED - c.syllabus) / 100 * c.chapters), 0))} chapters</b> in total.`
      : `No ${T2.toLowerCase()} is behind it.`}
      Across ${T1p.toLowerCase()}, coverage spans ${r1(covSpread)} points and average score ${r1(accSpread)}.</p>

  </div>`;
}

/* ============================================================
   PAGE 3 — ASSESSMENT AND STAFF
   ============================================================ */
function page3() {
  const pipeRows = TIER1.map(w => {
    const p = w.papersPlanned ? w.papers / w.papersPlanned * 100 : null;
    return [`<div class="nm">${esc(shortName(w.name))}</div>`, r0(w.papers), r0(w.papersPlanned),
      `<span class="st ${F.onPace(p) ? 'st-exc' : 'st-att'}">${pc0(p)}</span>`,
      r0(w.papersPublished), r0(w.pendingGrading), r0(w.papersScheduled), r0(w.papersDraft),
      F.onPace(p) ? '<span class="st st-exc">On pace</span>' : '<span class="st st-att">Behind</span>'];
  });
  const levels = Object.keys(CFG.engagementLevels);
  const engRows = TIER1.map(w => {
    const st = D.teachers.filter(t => t.wingId === w.id);
    return [`<div class="nm">${esc(shortName(w.name))}</div><div class="sub">${esc(w.head)}</div>`,
      r0(st.length),
      ...levels.map(L => {
        const n = st.filter(t => t.level === L).length;
        return `<span class="${L === CFG.minimalLevel && n ? 'st st-att' : ''}">${r0(n)}</span>`;
      }),
      st.length ? r1(st.reduce((a, t) => a + t.tests, 0) / st.length) : '—',
      st.length ? r1(st.reduce((a, t) => a + t.lastSeen, 0) / st.length) + 'd' : '—',
      scoreV(w.accuracy),
      covV(w.syllabus)];
  });
  const quietRows = F.quiet.slice().sort((a, b) => b.lastSeen - a.lastSeen).map(t => [
    `<div class="nm">${esc(t.name)}</div>`,
    esc(shortName((TIER1.find(w => w.id === t.wingId) || {}).name || t.wingId)),
    `<span class="sub">${esc(clip(t.subjects, 34))}</span>`, r0(t.classes),
    `<span class="st ${t.lastSeen >= 7 ? 'st-att' : ''}">${t.lastSeen === 0 ? 'today' : t.lastSeen + 'd'}</span>`,
    `<span class="st ${t.tests < 2 ? 'st-att' : ''}">${r0(t.tests)}</span>`,
    r0(t.hwGiven), t.avgScore == null ? '—' : pc0(t.avgScore)
  ]);

  return `<div class="pg">
    <div class="phead"><b>Assessment and staff</b><span>${esc(D.meta.school)} · ${esc(D.meta.asOf)} · page 3 of 4</span></div>

    <h2>Exam pipeline</h2>
    ${table([T1, N('Held'), N('Planned'), N('Held %'), N('Results out'), N('Results pending'),
             N('On calendar'), N('In draft'), 'Against pace'],
      pipeRows, { cap: 99, foot: ['School', r0(SCH.papers), r0(SCH.papersPlanned), pc0(F.pipePct),
        r0(SCH.papersPublished), r0(SCH.pendingGrading), r0(SCH.papersScheduled), r0(SCH.papersDraft),
        F.onPace(F.pipePct) ? '<span class="st st-exc">On pace</span>' : '<span class="st st-att">Behind</span>'] })}
    <p class="read">The four states sum to the plan. Held is ${pc0(F.pipePct)} of the year's papers
      against ${pc0(ELAPSED)} of the session elapsed; a row reads Behind when the first is under the
      second. This week ${SCH.wkDone} of ${SCH.wkPlanned} scheduled papers were held.</p>

    <h2>Staffing and engagement by ${T1.toLowerCase()}</h2>
    ${table([T1 + ' · coordinator', N('Teachers'), ...levels.map(L => N(CFG.engagementLevels[L])),
             N('Papers set, avg'), N('Days since login, avg'), N('Avg score'), N('Coverage')],
      engRows, { cap: 99 })}
    <p class="read">Engagement is measured from platform activity only — papers set, homework set and
      days since last login. Student results are not an input to it and are reported separately in the
      last two columns. ${CFG.engagementLevels[CFG.minimalLevel]} means fewer than two papers set this
      year, or seven or more days since logging in.</p>

    <h2>Teachers at ${CFG.engagementLevels[CFG.minimalLevel].toLowerCase()} engagement</h2>
    ${table(['Teacher', T1, T3 + 's taught', N(T2p), N('Last active'), N('Papers set'), N('Homework set'), N('Students\' avg score')],
      quietRows, { cap: 6, moreNote: `${F.quiet.length} at this level in total` })}
    <p class="read">Listed in order of days since last login. The final column is the average score of
      the students these teachers take, reported alongside rather than combined into the engagement
      measure.</p>
  </div>`;
}

/* ============================================================
   PAGE 4 — STUDENTS AND SIGN-OFF
   ============================================================ */
function page4() {
  const attRows = TIER1.map(w => {
    const below = D.absentees.filter(s => s.wingId === w.id).length;
    const risk = D.atRisk.filter(s => s.wingId === w.id).length;
    return [`<div class="nm">${esc(shortName(w.name))}</div>`, r0(w.students),
      attV(w.attendance),
      `<span class="st ${below ? 'st-att' : 'st-exc'}">${r0(below)}</span>`,
      r0(risk), `<span class="st ${D.meta.neverByWing[w.id] ? 'st-watch' : 'st-exc'}">${r0(D.meta.neverByWing[w.id] || 0)}</span>`,
      pc0(w.stu.adoptPct)];
  });
  /* the reason is read off the thresholds, not inferred */
  const reason = s => {
    const r = [];
    if (s.attendance < FLOOR) r.push(`attendance under ${FLOOR}%`);
    if (s.band === 'att') r.push('lowest score band');
    if (s.homework < 50) r.push('under half of homework in');
    if (s.neverIn) r.push('never signed in');
    return r.length ? r.join(', ') : 'combined index';
  };
  const interv = D.atRisk.slice().sort((a, b) => a.riskScore - b.riskScore).map(s => [
    `<div class="nm">${esc(s.name)}</div><div class="sub">roll ${s.roll} · ${esc(s.classTeacher)}</div>`,
    esc(shortCls(s.cls)), `<b>${r1(s.riskScore)}</b>`,
    s.score == null ? '—' : scoreV(s.score),
    attV(s.attendance),
    pc1(s.homework),
    `<span class="sub" style="font-size:7.4pt">${esc(reason(s))}</span>`
  ]);

  return `<div class="pg">
    <div class="phead"><b>Students and sign-off</b><span>${esc(D.meta.school)} · ${esc(D.meta.asOf)} · page 4 of 4</span></div>

    <h2>Attendance and student flags by ${T1.toLowerCase()}</h2>
    ${table([T1, N('Students'), N('Attendance'), N(`Under ${FLOOR}%`), N('Flagged at risk'),
             N('Never signed in'), N('Active this week')],
      attRows, { cap: 99, foot: ['School', r0(SCH.students), pc1(SCH.attendance), r0(F.absent),
        r0(F.atRisk), r0(F.never), pc0(F.adoptPct)] })}
    <p class="read">Attendance is taken from the daily register over the last ${D.meta.attDays} school
      days and rolls up weighted by roster size, not as an average of ${T2.toLowerCase()} percentages.
      ${r0(F.absent)} ${plural(F.absent, 'student')} ${plural(F.absent, 'is', 'are')} below the
      ${FLOOR}% CBSE floor for board eligibility${F.streak ? `; ${F.streak} of those ${plural(F.streak, 'has', 'have')}
      been absent ${CFG.streakAlert} or more consecutive days` : ''}.</p>

    <h2>Students flagged by the risk index</h2>
    ${table(['Student', T2, N('Risk index'), N('Avg score'), N('Attendance'), N('Homework'), 'Why listed'],
      interv, { cap: 10, moreNote: `${F.atRisk} flagged in total, lowest index first` })}
    <p class="read">Risk index = ${CFG.riskWeights}. Lowest first. The final column says what put each
      student on the list; one entry alone is enough.</p>

    <div class="sign">
      <div><div class="line"></div>Prepared by · ${esc(CFG.roles.prepared)}</div>
      <div><div class="line"></div>Reviewed by · ${esc(CFG.roles.reviewed)}</div>
      <div><div class="line"></div>Date</div>
    </div>
  </div>`;
}

document.getElementById('doc').innerHTML = page1() + page2() + page3() + page4();

</script>
</body></html>
